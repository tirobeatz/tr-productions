<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#050505"/>

  <!-- Gradient glow effect -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#050505;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
  </defs>

  <ellipse cx="600" cy="200" rx="500" ry="300" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <g stroke="#8B5CF6" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- Main title -->
  <text x="600" y="260" font-family="Arial Black, Helvetica, sans-serif" font-size="120" font-weight="900" fill="url(#text-grad)" text-anchor="middle">TR</text>
  <text x="600" y="360" font-family="Arial Black, Helvetica, sans-serif" font-size="60" font-weight="900" fill="white" text-anchor="middle">PRODUCTIONS</text>

  <!-- Tagline -->
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="28" fill="#9CA3AF" text-anchor="middle">Music Producer • Beats • Mixing • Mastering</text>

  <!-- Location -->
  <text x="600" y="490" font-family="Arial, sans-serif" font-size="20" fill="#6B7280" text-anchor="middle">Trier, Germany</text>

  <!-- Sound wave decoration -->
  <g fill="none" stroke="#8B5CF6" stroke-width="3" opacity="0.5">
    <path d="M200 550 Q250 520 300 550 T400 550 T500 550"/>
    <path d="M700 550 Q750 520 800 550 T900 550 T1000 550"/>
  </g>
</svg>
